name: DBT Branch Cleanup

on:
  # TEMPORARY: testing trigger for the personal fork.
  # Runs discovery + HTML report only. It never reaches the cleanup phase.
  # Remove this block before using the workflow in the real repo.
  push:
    branches:
      - feat/test-cleanup-1

  # Manual run. retention_days is a string on purpose: a number input of 0
  # would be treated as "false" by `||` and silently replaced by 30.
  workflow_dispatch:
    inputs:
      retention_days:
        description: "Minimum days since last commit (use 0 only when testing)"
        type: string
        default: "30"
      request_cleanup:
        description: "Ask DevOps for approval to delete after discovery"
        type: boolean
        default: true

  # Every Monday at 03:00 UTC (08:30 AM IST).
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  pull-requests: read

jobs:
  # =====================================================
  # PHASE 1: DISCOVER OLD BRANCHES + HTML REPORT
  # The report exists BEFORE approval, so DevOps can review it.
  # =====================================================
  discover:
    name: Phase 1 - Discover and report
    runs-on: ubuntu-latest
    outputs:
      candidate_count: ${{ steps.discovery.outputs.candidate_count }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Discover old feature branches
        id: discovery
        uses: actions/github-script@v7
        env:
          RETENTION_DAYS: ${{ inputs.retention_days || '30' }}
        with:
          script: |
            await require('./scripts/branch-cleanup-lib.js')
              .discover({ github, context, core });

      - name: Build HTML discovery report
        run: >-
          node scripts/render-report.js discovery
          branch-report-data.json
          scripts/branch-cleanup-final-report.html
          branch-discovery-report.html

      - name: Upload discovery data and report
        uses: actions/upload-artifact@v4
        with:
          name: branch-discovery
          path: |
            branch-report-data.json
            branch-discovery-report.html
          if-no-files-found: error
          retention-days: 90

  # =====================================================
  # PHASE 2: DEVOPS APPROVAL + CLEANUP
  # Needs required reviewers on the branch-cleanup-approval
  # environment (Settings > Environments). Without reviewers
  # this job starts immediately.
  # =====================================================
  cleanup:
    name: Phase 2 - Approved cleanup
    needs: discover
    if: >-
      needs.discover.outputs.candidate_count != '0' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.request_cleanup))
    runs-on: ubuntu-latest

    environment:
      name: branch-cleanup-approval

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download discovery data
        uses: actions/download-artifact@v4
        with:
          name: branch-discovery
          path: cleanup-input

      - name: Re-validate and delete approved branches
        uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/branch-cleanup-lib.js')
              .cleanup({ github, context, core });

      - name: Upload cleanup results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-cleanup-results
          path: cleanup-results.json
          if-no-files-found: warn
          retention-days: 90

  # =====================================================
  # PHASE 3: CONFIRM DELETIONS + FINAL HTML REPORT
  # =====================================================
  final_report:
    name: Phase 3 - Verify and final report
    needs: [discover, cleanup]
    if: >-
      always() &&
      needs.discover.result == 'success' &&
      needs.cleanup.result != 'skipped'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download discovery data
        uses: actions/download-artifact@v4
        with:
          name: branch-discovery
          path: report-input

      # Missing if the approval was rejected, so this must not fail the job.
      - name: Download cleanup results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: branch-cleanup-results
          path: cleanup-input

      - name: Confirm deleted branches are really gone
        uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/branch-cleanup-lib.js')
              .verifyDeletions({ github, context, core });

      - name: Build final HTML report
        run: >-
          node scripts/render-report.js final
          report-input/branch-report-data.json
          scripts/branch-cleanup-final-report.html
          branch-cleanup-final-report.html
          cleanup-input/cleanup-results.json

      - name: Upload final report
        uses: actions/upload-artifact@v4
        with:
          name: branch-cleanup-final
          path: branch-cleanup-final-report.html
          if-no-files-found: error
          retention-days: 90