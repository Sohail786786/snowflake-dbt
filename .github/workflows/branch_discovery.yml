
name: DBT Branch Discovery

on:
  # Temporary trigger for testing in your personal fork.
  push:
    branches:
      - feat/test-cleanup-1

  # Allows manual execution.
  workflow_dispatch:

  # Every Monday at 03:00 UTC (08:30 AM IST).
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  pull-requests: read

jobs:
  discover:
    name: Discover old feature branches
    runs-on: ubuntu-latest

    steps:
      - name: Discover branch candidates
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const baseBranch = 'main';
            const retentionDays = 30;
            const now = Date.now();
            const retentionMs = retentionDays * 24 * 60 * 60 * 1000;
            const cutoff = now - retentionMs;

            // Fetch all remote branches.
            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 }
            );

            const report = [];

            for (const branch of branches) {
              const name = branch.name;

              // Only inspect feature branches.
              if (!name.startsWith('feat/')) continue;

              const reasons = [];

              // Retrieve the latest commit details.
              let commitDate = null;

              try {
                const commitDetails = await github.rest.repos.getCommit({
                  owner,
                  repo,
                  ref: branch.commit.sha
                });

                commitDate =
                  commitDetails.data.commit.committer?.date ||
                  commitDetails.data.commit.author?.date ||
                  null;

              } catch (error) {
                core.warning(
                  `Could not retrieve commit details for ${name}: ${error.message}`
                );
              }

              const commitTimestamp = commitDate
                ? new Date(commitDate).getTime()
                : NaN;

              const validCommitDate = Number.isFinite(commitTimestamp);

              const ageDays = validCommitDate
                ? Math.floor((now - commitTimestamp) / 86400000)
                : null;

              // Check branch inactivity.
              if (!validCommitDate) {
                reasons.push('Last commit date unavailable or invalid');
              } else if (commitTimestamp > cutoff) {
                reasons.push(
                  `Branch is younger than ${retentionDays} days`
                );
              }

              // Check branch protection.
              if (branch.protected) {
                reasons.push('Branch is protected');
              }

              // Find pull requests originating from this branch.
              const prs = await github.paginate(
                github.rest.pulls.list,
                {
                  owner,
                  repo,
                  state: 'all',
                  head: `${owner}:${name}`,
                  per_page: 100
                }
              );

              const openPRs = prs.filter(
                pr => pr.state === 'open'
              );

              const mergedIntoMain = prs.some(
                pr => pr.merged_at && pr.base.ref === baseBranch
              );

              if (openPRs.length > 0) {
                reasons.push('Open pull request exists');
              }

              if (!mergedIntoMain) {
                reasons.push(
                  'No merged pull request into main found'
                );
              }

              // Check whether the branch contains commits
              // that are not present in main.
              let comparisonStatus = 'NOT_CHECKED';

              if (mergedIntoMain) {
                try {
                  const comparison =
                    await github.rest.repos.compareCommitsWithBasehead({
                      owner,
                      repo,
                      basehead: `${baseBranch}...${name}`
                    });

                  if (comparison.data.ahead_by > 0) {
                    comparisonStatus = 'REVIEW_REQUIRED';

                    reasons.push(
                      'Branch contains commits not found in main; manual review required'
                    );
                  } else {
                    comparisonStatus = 'PASSED';
                  }

                } catch (error) {
                  comparisonStatus = 'ERROR';

                  reasons.push(
                    'Could not compare branch with main'
                  );

                  core.warning(
                    `Comparison failed for ${name}: ${error.message}`
                  );
                }
              }

              const basicChecksPassed = reasons.length === 0;

              report.push({
                branch: name,
                lastCommit: commitDate || 'Unknown',
                ageDays: ageDays ?? 'Unknown',
                protected: branch.protected,
                mergedIntoMain,
                openPRCount: openPRs.length,
                comparisonStatus,
                basicChecks: basicChecksPassed
                  ? 'PASSED'
                  : 'EXCLUDED',
                deploymentVerification: 'NOT_CHECKED',
                result: basicChecksPassed
                  ? 'BASIC_CHECKS_PASSED_PENDING_DEPLOYMENT_VERIFICATION'
                  : 'NOT_ELIGIBLE',
                reasons: reasons.join('; ') || 'Basic checks passed'
              });
            }

            // Calculate dashboard statistics.
            const totalBranches = report.length;

            const basicChecksPassedCount = report.filter(
              item => item.basicChecks === 'PASSED'
            ).length;

            const excludedCount = report.filter(
              item => item.basicChecks === 'EXCLUDED'
            ).length;

            // Escape dynamic values before inserting them into HTML.
            const escapeHTML = value =>
              String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
              })[char]);

            // Generate branch table rows.
            const branchRows = report.map(item => {
              const statusClass =
                item.basicChecks === 'PASSED'
                  ? 'success'
                  : 'danger';

              return `
                <tr>
                  <td>
                    <strong>${escapeHTML(item.branch)}</strong>
                  </td>
                  <td>${escapeHTML(item.lastCommit)}</td>
                  <td>${escapeHTML(item.ageDays)} days</td>
                  <td>${item.protected ? 'Yes' : 'No'}</td>
                  <td>${item.mergedIntoMain ? 'Yes' : 'No'}</td>
                  <td>${escapeHTML(item.openPRCount)}</td>
                  <td>${escapeHTML(item.comparisonStatus)}</td>
                  <td>
                    <span class="badge ${statusClass}">
                      ${escapeHTML(item.result)}
                    </span>
                  </td>
                  <td>${escapeHTML(item.reasons)}</td>
                </tr>
              `;
            }).join('');

            // Generate HTML dashboard with internal CSS.
            const html = `
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">

              <title>DBT Branch Discovery Report</title>

              <style>
                * {
                  box-sizing: border-box;
                }

                body {
                  margin: 0;
                  padding: 30px;
                  background: #f3f5f9;
                  color: #1e293b;
                  font-family: Arial, Helvetica, sans-serif;
                }

                .container {
                  max-width: 1450px;
                  margin: auto;
                }

                .header {
                  background: linear-gradient(135deg, #172554, #1e40af);
                  color: white;
                  padding: 30px;
                  border-radius: 14px;
                  margin-bottom: 25px;
                }

                .header h1 {
                  margin: 0 0 10px;
                  font-size: 28px;
                }

                .header p {
                  color: #cbd5e1;
                  margin: 6px 0;
                }

                .header .subtitle {
                  font-size: 14px;
                }

                .cards {
                  display: grid;
                  grid-template-columns: repeat(3, 1fr);
                  gap: 20px;
                  margin-bottom: 25px;
                }

                .card {
                  background: white;
                  padding: 24px;
                  border-radius: 12px;
                  border: 1px solid #e2e8f0;
                  box-shadow: 0 3px 10px rgba(0,0,0,0.04);
                }

                .card h2 {
                  margin: 0 0 8px;
                  font-size: 32px;
                  color: #1e40af;
                }

                .card p {
                  margin: 0;
                  color: #64748b;
                  font-size: 14px;
                }

                .panel {
                  background: white;
                  padding: 25px;
                  border-radius: 12px;
                  border: 1px solid #e2e8f0;
                  margin-bottom: 22px;
                  overflow-x: auto;
                }

                .panel h2 {
                  margin-top: 0;
                  font-size: 20px;
                }

                .policy {
                  background: #eff6ff;
                  border-left: 4px solid #2563eb;
                  padding: 18px;
                  border-radius: 8px;
                  margin-bottom: 22px;
                  line-height: 1.8;
                  color: #1e40af;
                }

                table {
                  width: 100%;
                  min-width: 1100px;
                  border-collapse: collapse;
                }

                th, td {
                  padding: 15px;
                  text-align: left;
                  border-bottom: 1px solid #e2e8f0;
                  font-size: 13px;
                  vertical-align: top;
                }

                th {
                  background: #f8fafc;
                  color: #475569;
                  font-weight: 600;
                }

                tr:hover {
                  background: #f8fafc;
                }

                .badge {
                  display: inline-block;
                  padding: 7px 11px;
                  border-radius: 20px;
                  font-size: 11px;
                  font-weight: bold;
                  white-space: nowrap;
                }

                .success {
                  background: #dcfce7;
                  color: #15803d;
                }

                .danger {
                  background: #fee2e2;
                  color: #b91c1c;
                }

                .warning {
                  background: #fef3c7;
                  color: #92400e;
                }

                .footer {
                  text-align: center;
                  color: #64748b;
                  font-size: 12px;
                  padding: 25px;
                }

                @media (max-width: 700px) {
                  body {
                    padding: 12px;
                  }

                  .cards {
                    grid-template-columns: 1fr;
                  }

                  .header h1 {
                    font-size: 22px;
                  }
                }

                @media print {
                  body {
                    background: white;
                    padding: 0;
                  }

                  .card, .panel {
                    box-shadow: none;
                  }
                }
              </style>
            </head>

            <body>
              <div class="container">

                <header class="header">
                  <h1>DBT Branch Discovery</h1>
                  <p class="subtitle">
                    Automated Branch Cleanup Dashboard
                  </p>
                  <p>
                    Generated: ${new Date().toISOString()}
                  </p>
                  <p>
                    Repository: ${escapeHTML(owner)}/${escapeHTML(repo)}
                  </p>
                </header>

                <section class="cards">

                  <div class="card">
                    <h2>${totalBranches}</h2>
                    <p>Total branches scanned</p>
                  </div>

                  <div class="card">
                    <h2>${basicChecksPassedCount}</h2>
                    <p>Passed basic checks</p>
                  </div>

                  <div class="card">
                    <h2>${excludedCount}</h2>
                    <p>Excluded branches</p>
                  </div>

                </section>

                <section class="policy">
                  <strong>Retention policy:</strong>
                  ${retentionDays} days since last commit.
                  <br>

                  <strong>Base branch:</strong>
                  ${escapeHTML(baseBranch)}
                  <br>

                  <strong>Deployment verification:</strong>
                  Not checked by this discovery workflow.
                  <br>

                  <strong>Deletion status:</strong>
                  No branches deleted.
                </section>

                <section class="panel">
                  <h2>Branch Discovery Results</h2>

                  <table>
                    <thead>
                      <tr>
                        <th>Branch</th>
                        <th>Last Commit</th>
                        <th>Age</th>
                        <th>Protected</th>
                        <th>Merged</th>
                        <th>Open PRs</th>
                        <th>Comparison</th>
                        <th>Result</th>
                        <th>Reasons</th>
                      </tr>
                    </thead>

                    <tbody>
                      ${branchRows || `
                        <tr>
                          <td colspan="9">
                            No feature branches found.
                          </td>
                        </tr>
                      `}
                    </tbody>
                  </table>
                </section>

                <footer class="footer">
                  DBT Branch Cleanup Automation
                  <br>
                  Discovery only — no branches were deleted.
                </footer>

              </div>
            </body>
            </html>
            `;

            fs.writeFileSync(
              'branch-discovery-report.html',
              html
            );

            // Create GitHub Actions summary.
            const summaryRows = report.map(item => [
              item.branch,
              item.lastCommit,
              String(item.ageDays),
              String(item.protected),
              String(item.mergedIntoMain),
              String(item.openPRCount),
              item.comparisonStatus,
              item.basicChecks,
              item.deploymentVerification,
              item.result,
              item.reasons
            ]);

            const summaryHeaders = [
              'Branch',
              'Last Commit',
              'Age (Days)',
              'Protected',
              'Merged Into Main',
              'Open PRs',
              'Comparison',
              'Basic Checks',
              'Deployment Verification',
              'Result',
              'Reasons'
            ];

            await core.summary
              .addHeading('DBT Branch Discovery Report')
              .addRaw(
                `Retention policy: ${retentionDays} days since last commit`
              )
              .addTable([
                summaryHeaders.map(header => ({
                  data: header,
                  header: true
                })),
                ...summaryRows
              ])
              .addRaw(
                `\nInspected ${totalBranches} feature branches.`
              )
              .write();

            core.info(
              `Inspected ${totalBranches} feature branches.`
            );

            core.info(
              `Passed basic checks: ${basicChecksPassedCount}`
            );

            core.info(
              `Excluded branches: ${excludedCount}`
            );

            core.info(
              'HTML discovery report generated successfully.'
            );

            core.info('No branches were deleted.');

      - name: Upload HTML discovery report
        uses: actions/upload-artifact@v4
        with:
          name: dbt-branch-discovery-html-report
          path: branch-discovery-report.html
          if-no-files-found: error
          retention-days: 90
