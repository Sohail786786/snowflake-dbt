
name: DBT Branch Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # Every Monday at 03:00 UTC

permissions:
  contents: read
  pull-requests: read

jobs:
  discover:
    name: Discover old feature branches
    runs-on: ubuntu-latest

    steps:
      - name: Discover branch candidates
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const baseBranch = 'main';
            const retentionDays = 30;
            const now = Date.now();
            const retentionMs = retentionDays * 24 * 60 * 60 * 1000;
            const cutoff = now - retentionMs;

            // Fetch all remote branches.
            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 }
            );

            const report = [];

            for (const branch of branches) {
              const name = branch.name;

              // Only inspect feature branches.
              if (!name.startsWith('feat/')) continue;

              const reasons = [];

              // Get the most recent commit date.
              const commitDate =
                branch.commit.commit.committer?.date ||
                branch.commit.commit.author?.date ||
                null;

              const commitTimestamp = commitDate
                ? new Date(commitDate).getTime()
                : NaN;

              const validCommitDate = Number.isFinite(commitTimestamp);

              const ageDays = validCommitDate
                ? Math.floor((now - commitTimestamp) / 86400000)
                : null;

              // Check branch inactivity.
              if (!validCommitDate) {
                reasons.push('Last commit date unavailable or invalid');
              } else if (commitTimestamp > cutoff) {
                reasons.push(`Branch is younger than ${retentionDays} days`);
              }

              // Check branch protection.
              if (branch.protected) {
                reasons.push('Branch is protected');
              }

              // Find pull requests originating from this branch.
              const prs = await github.paginate(
                github.rest.pulls.list,
                {
                  owner,
                  repo,
                  state: 'all',
                  head: `${owner}:${name}`,
                  per_page: 100
                }
              );

              const openPRs = prs.filter(pr => pr.state === 'open');

              const mergedIntoMain = prs.some(
                pr => pr.merged_at && pr.base.ref === baseBranch
              );

              if (openPRs.length > 0) {
                reasons.push('Open pull request exists');
              }

              if (!mergedIntoMain) {
                reasons.push('No merged pull request into main found');
              }

              // Conservative check for commits not present in main.
              let comparisonStatus = 'NOT_CHECKED';

              if (mergedIntoMain) {
                try {
                  const comparison =
                    await github.rest.repos.compareCommitsWithBasehead({
                      owner,
                      repo,
                      basehead: `${baseBranch}...${name}`
                    });

                  if (comparison.ahead_by > 0) {
                    comparisonStatus = 'REVIEW_REQUIRED';
                    reasons.push(
                      'Branch contains commits not found in main; manual review required'
                    );
                  } else {
                    comparisonStatus = 'PASSED';
                  }
                } catch (error) {
                  comparisonStatus = 'ERROR';
                  reasons.push('Could not compare branch with main');
                  core.warning(
                    `Comparison failed for ${name}: ${error.message}`
                  );
                }
              }

              const basicChecksPassed = reasons.length === 0;

              report.push({
                branch: name,
                lastCommit: commitDate || 'Unknown',
                ageDays: ageDays ?? 'Unknown',
                protected: branch.protected,
                mergedIntoMain,
                openPRCount: openPRs.length,
                comparisonStatus,
                basicChecks: basicChecksPassed ? 'PASSED' : 'EXCLUDED',
                deploymentVerification: 'NOT_CHECKED',
                result: basicChecksPassed
                  ? 'BASIC_CHECKS_PASSED_PENDING_DEPLOYMENT_VERIFICATION'
                  : 'NOT_ELIGIBLE',
                reasons: reasons.join('; ') || 'Basic checks passed'
              });
            }

            // Generate CSV and JSON reports.
            const headers = [
              'Branch',
              'Last Commit',
              'Age (Days)',
              'Protected',
              'Merged Into Main',
              'Open PRs',
              'Comparison',
              'Basic Checks',
              'Deployment Verification',
              'Result',
              'Reasons'
            ];

            const escapeCSV = value =>
              `"${String(value).replace(/"/g, '""')}"`;

            const rows = report.map(item => [
              item.branch,
              item.lastCommit,
              item.ageDays,
              item.protected,
              item.mergedIntoMain,
              item.openPRCount,
              item.comparisonStatus,
              item.basicChecks,
              item.deploymentVerification,
              item.result,
              item.reasons
            ].map(escapeCSV).join(','));

            fs.writeFileSync(
              'branch-discovery-report.csv',
              [headers.map(escapeCSV).join(','), ...rows].join('\n')
            );

            fs.writeFileSync(
              'branch-discovery-report.json',
              JSON.stringify(report, null, 2)
            );

            // Create GitHub Actions summary.
            const summaryRows = report.map(item => [
              item.branch,
              String(item.ageDays),
              String(item.protected),
              String(item.mergedIntoMain),
              String(item.openPRCount),
              item.comparisonStatus,
              item.basicChecks,
              item.deploymentVerification,
              item.result,
              item.reasons
            ]);

            await core.summary
              .addHeading('DBT Branch Discovery Report')
              .addRaw(`Retention policy: ${retentionDays} days since last commit`)
              .addTable([
                headers.map(header => ({
                  data: header,
                  header: true
                })),
                ...summaryRows
              ])
              .addRaw(`\nInspected ${report.length} feature branches.`)
              .write();

            const eligibleCount = report.filter(
              item => item.basicChecks === 'PASSED'
            ).length;

            core.info(`Inspected ${report.length} feature branches.`);
            core.info(`Passed basic checks: ${eligibleCount}`);
            core.info('No branches were deleted.');

      - name: Upload discovery reports
        uses: actions/upload-artifact@v4
        with:
          name: dbt-branch-discovery-report
          path: |
            branch-discovery-report.csv
            branch-discovery-report.json
          if-no-files-found: error
          retention-days: 90
